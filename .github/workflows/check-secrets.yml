# Scan every change that reaches GitHub for credentials and personal data,
# including changes made in the GitHub web UI (for example a merge conflict
# resolved in the browser), which the local Git and Claude Code hooks never see.
#
# The scan itself is scripts/check-secrets.sh (the same script as the local
# hooks), run in --range mode over the commits of the pull request or push.
#
# Jobs:
#   check-secrets   every pull request and every push (all branches and
#                   tags). Runs the scanner twice: the trusted version (from
#                   the base branch, or main) so that a change cannot switch
#                   off its own scan, and the version in the change so that
#                   new rules apply at once. Gets no secrets.
#   tests           the automated tests of the scanner (tests/).
#   personal-words  pushes to main only. Scans the whole repository (every
#                   branch and tag) with the personal-word list and fails when
#                   the list is missing. The list is a secret of the
#                   "personal-words" environment, which should be limited to
#                   the main branch in the repository settings, so that a pull
#                   request that edits this workflow cannot read it.
name: check-secrets

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['**']

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the commits of this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -u
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Commits on the PR branch that are not on the base branch. The
            # base is the merge base, so commits that the base gained later
            # are not rescanned.
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            head="$PR_HEAD"
            ref="refs/heads/$PR_HEAD_REF"
            trusted="$PR_BASE"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
            ref="$PUSH_REF"
            # A new branch or a force push leaves no usable "before": scan
            # the whole history instead (all-zero base).
            if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$zero
            fi
            # Only main's own history is trusted to provide the scanner.
            if [[ "$PUSH_REF" == "refs/heads/main" && "$base" != "$zero" ]]; then
              trusted="$base"
            else
              trusted=$(git rev-parse -q --verify refs/remotes/origin/main) || trusted=""
            fi
          fi
          echo "scan range: $base..$head"
          rc=0
          if [[ -n "$trusted" ]] && git cat-file -e "$trusted:scripts/check-secrets.sh" 2>/dev/null; then
            echo "::group::trusted scanner (${trusted:0:12})"
            git show "$trusted:scripts/check-secrets.sh" > "$RUNNER_TEMP/check-secrets.trusted.sh"
            bash "$RUNNER_TEMP/check-secrets.trusted.sh" --range "$base" "$head" || rc=2
            echo "::endgroup::"
          else
            echo "trusted scanner: not available"
          fi
          echo "::group::scanner of this change"
          bash scripts/check-secrets.sh --range "$base" "$head" --ref "$ref" || rc=2
          echo "::endgroup::"
          exit "$rc"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run the scanner tests
        run: bash tests/check-secrets.test.sh

  personal-words:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: personal-words
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan everything with the personal-word list
        env:
          # One personal word per line, stored as a secret of the
          # personal-words environment (not as a repository secret).
          ESM_DENYLIST: ${{ secrets.ESM_DENYLIST }}
        run: |
          set -u
          if [[ -n "${ESM_DENYLIST:-}" ]]; then
            # Must live outside the repository (the script refuses otherwise).
            denylist="$RUNNER_TEMP/esm-denylist.txt"
            printf '%s\n' "$ESM_DENYLIST" > "$denylist"
            export ESM_DENYLIST_FILE="$denylist"
          fi
          # Fails when the list is missing (--require-denylist): until the
          # repository is public, a missing list must be noticed.
          bash scripts/check-secrets.sh --all --require-denylist
